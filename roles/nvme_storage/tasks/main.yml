---
# =============================================================
# NVMe Storage, LVM Provisioning & Zero-Downtime K3s Migration
# =============================================================

- name: Ensure required storage, iSCSI, and LVM packages are installed
  ansible.builtin.apt:
    name:
      - lvm2
      - parted
      - rsync
      - nvme-cli
      - smartmontools
      - open-iscsi
      - nfs-common
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Ensure iscsid service is enabled and started for Longhorn CSI
  ansible.builtin.systemd:
    name: iscsid
    state: started
    enabled: true

- name: Cap systemd-journald disk usage to 100M to prevent log bloat
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: '^#?SystemMaxUse='
    line: 'SystemMaxUse=100M'
  register: journald_cap

- name: Vacuum and restart systemd-journald if configuration changed
  ansible.builtin.shell: |
    journalctl --vacuum-size=100M
    systemctl restart systemd-journald
  when: journald_cap.changed

- name: Check if NVMe drive ({{ nvme_device }}) is physically installed
  ansible.builtin.stat:
    path: "{{ nvme_device }}"
  register: nvme_device_stat

- name: Report NVMe detection status
  ansible.builtin.debug:
    msg: "NVMe drive {{ nvme_device }} is {{ 'INSTALLED' if nvme_device_stat.stat.exists else 'NOT INSTALLED (Skipping node)' }} on {{ inventory_hostname }}"

- name: Provision NVMe, LVM, and migrate K3s runtime off eMMC
  when: nvme_device_stat.stat.exists
  block:
    # ---------------------------------------------------------
    # 1. GPT Partitioning (Partition 1: 80GiB K3s, Partition 2: LVM)
    # ---------------------------------------------------------
    - name: Create Partition 1 ({{ nvme_k3s_partition_size }}) for K3s and System Logs
      community.general.parted:
        device: "{{ nvme_device }}"
        number: 1
        label: gpt
        name: k3s_system
        part_start: 1MiB
        part_end: "{{ nvme_k3s_partition_size }}"
        state: present
      register: part1_created

    - name: Create Partition 2 (Remaining capacity) for LVM Volume Group
      community.general.parted:
        device: "{{ nvme_device }}"
        number: 2
        label: gpt
        name: homelab_lvm
        part_start: "{{ nvme_k3s_partition_size }}"
        part_end: 100%
        flags: [ lvm ]
        state: present
      register: part2_created

    - name: Inform kernel of partition table changes
      ansible.builtin.shell: |
        partprobe {{ nvme_device }}
        udevadm settle
      when: part1_created.changed or part2_created.changed

    # ---------------------------------------------------------
    # 2. LVM Volume Group & Logical Volumes (Profile 3)
    # ---------------------------------------------------------
    - name: Create Volume Group {{ nvme_vg_name }} on {{ nvme_device }}p2
      community.general.lvg:
        vg: "{{ nvme_vg_name }}"
        pvs: "{{ nvme_device }}p2"
        pesize: "4M"
        state: present

    - name: Create Logical Volume {{ nvme_lv_longhorn_name }} ({{ nvme_lv_longhorn_size }})
      community.general.lvol:
        vg: "{{ nvme_vg_name }}"
        lv: "{{ nvme_lv_longhorn_name }}"
        size: "{{ nvme_lv_longhorn_size }}"
        state: present

    - name: Create Logical Volume {{ nvme_lv_nas_name }} ({{ nvme_lv_nas_size }})
      community.general.lvol:
        vg: "{{ nvme_vg_name }}"
        lv: "{{ nvme_lv_nas_name }}"
        size: "{{ nvme_lv_nas_size }}"
        state: present

    # ---------------------------------------------------------
    # 3. Filesystem Formatting (ext4 with 1% reserved blocks)
    # ---------------------------------------------------------
    - name: Format Partition 1 as ext4 (K3S_SYSTEM)
      community.general.filesystem:
        fstype: ext4
        dev: "{{ nvme_device }}p1"
        opts: "-L K3S_SYSTEM -m 1"

    - name: Format Longhorn Logical Volume as ext4 (LONGHORN)
      community.general.filesystem:
        fstype: ext4
        dev: "/dev/{{ nvme_vg_name }}/{{ nvme_lv_longhorn_name }}"
        opts: "-L LONGHORN -m 1"

    - name: Format NAS Logical Volume as ext4 (NAS_STORAGE)
      community.general.filesystem:
        fstype: ext4
        dev: "/dev/{{ nvme_vg_name }}/{{ nvme_lv_nas_name }}"
        opts: "-L NAS_STORAGE -m 1"

    # ---------------------------------------------------------
    # 4. Mount Base NVMe System Partition, Longhorn & NAS
    # ---------------------------------------------------------
    - name: Ensure mount point directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /mnt/nvme_system
        - /var/lib/longhorn
        - "{{ nas_base_dir }}"

    - name: Mount K3s System partition to /mnt/nvme_system
      ansible.posix.mount:
        path: /mnt/nvme_system
        src: "{{ nvme_device }}p1"
        fstype: ext4
        opts: defaults,noatime
        state: mounted

    - name: Ensure rancher and log subdirectories exist on /mnt/nvme_system
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /mnt/nvme_system/rancher
        - /mnt/nvme_system/log

    - name: Mount Longhorn Logical Volume to /var/lib/longhorn
      ansible.posix.mount:
        path: /var/lib/longhorn
        src: "/dev/{{ nvme_vg_name }}/{{ nvme_lv_longhorn_name }}"
        fstype: ext4
        opts: defaults,noatime
        state: mounted

    - name: Mount NAS Logical Volume to {{ nas_base_dir }}
      ansible.posix.mount:
        path: "{{ nas_base_dir }}"
        src: "/dev/{{ nvme_vg_name }}/{{ nvme_lv_nas_name }}"
        fstype: ext4
        opts: defaults,noatime
        state: mounted

    # ---------------------------------------------------------
    # 5. Zero-Data-Loss Migration of /var/lib/rancher & /var/log
    # ---------------------------------------------------------
    - name: Check current mount source of /var/lib/rancher
      ansible.builtin.command: findmnt -n -o SOURCE /var/lib/rancher
      register: rancher_mount_check
      changed_when: false
      failed_when: false

    - name: Migrate /var/lib/rancher and /var/log from eMMC to NVMe
      when: "'nvme' not in (rancher_mount_check.stdout | default(''))"
      block:
        - name: Stop K3s and cleanly unmount containerd/kubelet runtime mounts
          ansible.builtin.command: /usr/local/bin/k3s-killall.sh

        - name: Stop rsyslog temporarily before syncing /var/log
          ansible.builtin.systemd:
            name: rsyslog
            state: stopped
          failed_when: false

        - name: Sync /var/lib/rancher from eMMC to /mnt/nvme_system/rancher
          ansible.builtin.command: rsync -aHAX --delete /var/lib/rancher/ /mnt/nvme_system/rancher/

        - name: Sync /var/log from eMMC to /mnt/nvme_system/log
          ansible.builtin.command: rsync -aHAX /var/log/ /mnt/nvme_system/log/

        - name: Bind-mount /mnt/nvme_system/rancher to /var/lib/rancher
          ansible.posix.mount:
            path: /var/lib/rancher
            src: /mnt/nvme_system/rancher
            fstype: none
            opts: bind,defaults,noatime
            state: mounted

        - name: Bind-mount /mnt/nvme_system/log to /var/log
          ansible.posix.mount:
            path: /var/log
            src: /mnt/nvme_system/log
            fstype: none
            opts: bind,defaults,noatime
            state: mounted

        - name: Restart systemd-journald and rsyslog on new NVMe /var/log mount
          ansible.builtin.shell: |
            systemctl restart systemd-journald
            systemctl start rsyslog || true

        - name: Reclaim underlying eMMC space shadowed by /var/lib/rancher and /var/log mounts
          ansible.builtin.shell: |
            mkdir -p /mnt/emmc_root_cleanup
            mount --bind / /mnt/emmc_root_cleanup
            rm -rf /mnt/emmc_root_cleanup/var/lib/rancher/*
            rm -rf /mnt/emmc_root_cleanup/var/log/*
            umount /mnt/emmc_root_cleanup
            rmdir /mnt/emmc_root_cleanup

        - name: Start K3s service on migrated NVMe storage
          ansible.builtin.systemd:
            name: k3s
            state: started
            enabled: true

        - name: Wait for local K3s API (6443) to become ready
          ansible.builtin.wait_for:
            host: "{{ ansible_host }}"
            port: 6443
            delay: 5
            timeout: 120

        - name: Wait for Kubernetes node {{ inventory_hostname }} to report Ready
          ansible.builtin.shell: |
            for i in $(seq 1 30); do
              status=$(/usr/local/bin/k3s kubectl get node {{ inventory_hostname }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
              if [ "$status" = "True" ]; then
                exit 0
              fi
              sleep 3
            done
            exit 1
          changed_when: false

    # ---------------------------------------------------------
    # 6. Label Node for Longhorn Default Disk Provisioning
    # ---------------------------------------------------------
    - name: Label NVMe-equipped K8s node for Longhorn storage scheduling
      ansible.builtin.command: >
        /usr/local/bin/k3s kubectl label node {{ inventory_hostname }}
        node.longhorn.io/create-default-disk=true --overwrite
      changed_when: false
