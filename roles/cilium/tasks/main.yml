---
- name: Create local Cilium output directory
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../cilium/rendered"
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false
  run_once: true

- name: Render Cilium Helm values and L2 manifests
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ playbook_dir }}/../cilium/rendered/{{ item.dest }}"
    mode: '0644'
  loop:
    - { src: 'values.yaml.j2', dest: 'values.yaml' }
    - { src: 'lb-ip-pool.yaml.j2', dest: 'lb-ip-pool.yaml' }
    - { src: 'l2-policy.yaml.j2', dest: 'l2-policy.yaml' }
  delegate_to: localhost
  become: false
  run_once: true

- name: Install or upgrade Cilium CNI via Helm
  ansible.builtin.command: >
    helm upgrade --install cilium {{ cilium_chart_url }}
    --version {{ cilium_chart_version }}
    --namespace kube-system
    -f {{ playbook_dir }}/../cilium/rendered/values.yaml
  delegate_to: localhost
  become: false
  run_once: true

- name: Copy Cilium L2 manifests to init server node
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../cilium/rendered/{{ item }}"
    dest: "/tmp/{{ item }}"
    mode: '0644'
  loop:
    - lb-ip-pool.yaml
    - l2-policy.yaml
  when: inventory_hostname == k3s_server_init_node

- name: Wait for Cilium DaemonSet to become ready
  ansible.builtin.command: /usr/local/bin/k3s kubectl rollout status ds/cilium -n kube-system --timeout=180s
  when: inventory_hostname == k3s_server_init_node
  changed_when: false

- name: Wait for all Kubernetes nodes to become Ready
  ansible.builtin.command: /usr/local/bin/k3s kubectl wait --for=condition=Ready nodes --all --timeout=180s
  when: inventory_hostname == k3s_server_init_node
  changed_when: false

- name: Apply Cilium LoadBalancer IP Pool
  ansible.builtin.command: /usr/local/bin/k3s kubectl apply -f /tmp/lb-ip-pool.yaml
  when: inventory_hostname == k3s_server_init_node

- name: Apply Cilium L2 Announcement Policy
  ansible.builtin.command: /usr/local/bin/k3s kubectl apply -f /tmp/l2-policy.yaml
  when: inventory_hostname == k3s_server_init_node

- name: Clean up temporary manifests from init server node
  ansible.builtin.file:
    path: "/tmp/{{ item }}"
    state: absent
  loop:
    - lb-ip-pool.yaml
    - l2-policy.yaml
  when: inventory_hostname == k3s_server_init_node
