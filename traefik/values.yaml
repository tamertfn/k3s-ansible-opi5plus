providers:
  kubernetesGateway:
    enabled: true
  kubernetesIngress:
    enabled: true
  kubernetesCRD:
    enabled: true
gateway:
  enabled: true
  name: traefik-gateway
  namespace: traefik
  listeners:
    web:
      port: 8000
      protocol: HTTP
      namespacePolicy:
        from: All
    websecure:
      port: 8443
      protocol: HTTPS
      namespacePolicy:
        from: All
      certificateRefs:
      - name: local-selfsigned-tls
service:
  enabled: true
  type: LoadBalancer
  annotations:
    io.cilium/lb-ipam-ips: 192.168.1.210
  spec:
    externalTrafficPolicy: Local
ports:
  web:
    exposedPort: 80
  websecure:
    exposedPort: 443
deployment:
  enabled: true
  kind: Deployment
  replicas: 3
ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik.opi.tamer.io`)
    entryPoints:
    - web
    - websecure
    tls:
      secretName: local-selfsigned-tls
    middlewares:
    - name: dashboard-redirect
extraObjects:
- apiVersion: traefik.io/v1alpha1
  kind: Middleware
  metadata:
    name: dashboard-redirect
    namespace: traefik
  spec:
    redirectRegex:
      regex: ^(https?://[^/]+)/?$
      replacement: ${1}/dashboard/
      permanent: true
- apiVersion: traefik.io/v1alpha1
  kind: TLSStore
  metadata:
    name: default
    namespace: traefik
  spec:
    defaultCertificate:
      secretName: local-selfsigned-tls
